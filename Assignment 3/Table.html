<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Price Comparison</title>

<style>
/* CSS variables - sir ne :root me mangi hai */
:root {
  --main-color: #2a5d8a;
  --light-bg: #f2f2f2;
  --padding: 10px;
  --font-size: 14px;
}

body { font-family: Arial; background: #f1eeee; padding: 20px; }
h1 { text-align: center; }
table { width: 100%; border-collapse: collapse; font-size: var(--font-size); }

th, td { border: 1px solid black; padding: var(--padding); text-align: center; }
th { background: var(--main-color); color: white; }

</style>
</head>
<body>

<h1>Mobile Price Comparison</h1>

<table>
<caption>Best Mobiles Price List - 2026</caption>

<thead>
<!-- COLSPAN 1 - poori 10 line ko ek kiya -->
<tr><th colspan="10">Best Mobiles Under 30000</th></tr>
<tr>
<th scope="col">S.No</th>
<th scope="col">Brand</th>
<th scope="col">Model</th>
<th scope="col">RAM</th>
<th scope="col">Storage</th>
<th scope="col">Camera</th>
<th scope="col">Battery</th>
<th scope="col">Display</th>
<th scope="col">Price</th>
<th scope="col">Rating</th>
</tr>
</thead>



</table>
</body>
</html>
